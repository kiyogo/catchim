name: Feature Request
description: Suggest an idea or feature for Catchim
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Target Component
      description: Which part of Catchim is this feature request for?
      options:
        - App (C++ Desktop)
        - Web (Browser Editor)
        - Both
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem? Please describe.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
