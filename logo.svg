<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#182136" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.3" />
    </linearGradient>

    <!-- Ribbon Gradient: Cyan to Indigo (Top Hook) -->
    <linearGradient id="grad-top" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Ribbon Gradient: Violet to Rose (Bottom Hook) -->
    <linearGradient id="grad-bottom" x1="0%" y1="20%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Play/Cut Accent Gradient -->
    <linearGradient id="grad-play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="116" fill="none" stroke="url(#border)" stroke-width="2" />

  <!-- Ambient Glow -->
  <circle cx="230" cy="256" r="120" fill="#6366F1" opacity="0.15" filter="url(#soft-glow)" />

  <!-- Main Symbol: The Cut C + Play Symbol -->
  <g transform="translate(0, 0)">
    <!-- Top Arc of C -->
    <path d="M 330 148
             C 300 120, 260 108, 220 108
             C 138 108, 92 168, 92 256
             C 92 284, 98 310, 110 334
             L 168 312
             C 158 296, 154 278, 154 256
             C 154 198, 180 166, 222 166
             C 250 166, 276 176, 296 196
             Z"
          fill="url(#grad-top)" />

    <!-- Bottom Arc of C -->
    <path d="M 110 334
             C 134 380, 178 404, 230 404
             C 278 404, 320 384, 352 350
             L 308 308
             C 286 332, 258 346, 228 346
             C 194 346, 174 330, 168 312
             Z"
          fill="url(#grad-bottom)" />

    <!-- Playhead / Cut Blade (Triangle with precision cut angle) -->
    <path d="M 236 200
             L 344 260
             C 352 264, 352 276, 344 280
             L 236 340
             C 226 346, 214 338, 214 326
             L 214 214
             C 214 202, 226 194, 236 200 Z"
          fill="url(#grad-play)" />

    <!-- Film Frame Perforation Dots -->
    <circle cx="120" cy="168" r="6" fill="#38BDF8" opacity="0.6" />
    <circle cx="98" cy="216" r="6" fill="#6366F1" opacity="0.6" />
    <circle cx="98" cy="296" r="6" fill="#818CF8" opacity="0.6" />
    <circle cx="120" cy="344" r="6" fill="#A855F7" opacity="0.6" />
  </g>
</svg>
